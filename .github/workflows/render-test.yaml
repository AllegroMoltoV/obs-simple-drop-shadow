name: Render shadow on macOS and Linux
# macOS と Linux の OpenGL で、影のエフェクトのコンパイルと描画を確かめる。
# 開発者は macOS と Linux の機材を持たないため、この 2 つの OS の描画はこのワークフローで検証する。
# - drop-shadow-filter-integration-test: 出力の大きさ・元画像と影の位置・影の形・色・設定変更を検査する
# - drop-shadow-filter-benchmark の profile モード: 影の有無・ぼけ幅・裾の範囲を判定する
# どちらも検査に外れると終了コード 1 を返す
on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/ui-improvement'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/render-test.yaml'
permissions:
  contents: read
env:
  SCENARIOS: hard-shadow negative-offset color-opacity blur-small blur-large blur-max settings-update scene-compensation
  PROFILE_RADII: 0 3 20 128 372
jobs:
  ubuntu-render:
    name: Render on Ubuntu (Mesa OpenGL)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build plugin
        uses: ./.github/actions/build-plugin
        with:
          target: x86_64
          config: RelWithDebInfo

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libegl-mesa0 libx11-dev

      - name: Build render tests
        run: |
          cmake -S . -B build_x86_64 -DENABLE_RENDER_TESTS=ON
          cmake --build build_x86_64 --config RelWithDebInfo --target drop-shadow-filter-integration-test drop-shadow-filter-benchmark

      - name: Render shadow
        run: |
          set -o pipefail
          plugin=$(find "$PWD/build_x86_64" -name 'simple-drop-shadow.so' -print -quit)
          integration=$(find "$PWD/build_x86_64" -name 'drop-shadow-filter-integration-test' -type f -print -quit)
          bench=$(find "$PWD/build_x86_64" -name 'drop-shadow-filter-benchmark' -type f -print -quit)
          gl=$(find /usr/lib -name 'libobs-opengl.so*' -print -quit)
          echo "plugin=${plugin} integration=${integration} bench=${bench} gl=${gl}"
          failed=0
          for scenario in ${SCENARIOS}; do
            if xvfb-run -a -s '-screen 0 1280x720x24' "${integration}" "${plugin}" "$PWD/data" "${gl}" \
              /usr/share/obs/libobs "${scenario}" >> render-ubuntu.log 2>&1; then
              echo "PASS ${scenario}" | tee -a render-ubuntu.log
            else
              echo "FAIL ${scenario}" | tee -a render-ubuntu.log
              failed=1
            fi
          done
          xvfb-run -a -s '-screen 0 1280x720x24' "${bench}" "${plugin}" "$PWD/data" "${gl}" /usr/share/obs/libobs \
            profile ${PROFILE_RADII} 2>&1 | tee -a render-ubuntu.log
          exit ${failed}

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-ubuntu
          path: render-ubuntu.log
          if-no-files-found: warn

  macos-render:
    name: Render on macOS (OpenGL)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.1.0.app/Contents/Developer

      - name: Build plugin
        uses: ./.github/actions/build-plugin
        with:
          target: macos-universal
          config: RelWithDebInfo

      - name: Build render tests and OpenGL module
        run: |
          cmake -S . -B build_macos -DENABLE_RENDER_TESTS=ON
          cmake --build build_macos --config RelWithDebInfo --target drop-shadow-filter-integration-test drop-shadow-filter-benchmark
          cmake --build .deps/obs-studio-31.1.1/build_universal --config Release --target libobs-opengl

      - name: Render shadow
        run: |
          plugin=$(find "$PWD/build_macos" -path '*RelWithDebInfo/simple-drop-shadow.plugin/Contents/MacOS/simple-drop-shadow' -print -quit)
          integration=$(find "$PWD/build_macos" -name 'drop-shadow-filter-integration-test' -type f -perm -u+x -print -quit)
          bench=$(find "$PWD/build_macos" -name 'drop-shadow-filter-benchmark' -type f -perm -u+x -print -quit)
          gl=$(find "$PWD/.deps/obs-studio-31.1.1/build_universal" \( -name 'libobs-opengl.dylib' -o -name 'libobs-opengl.so' \) -print -quit)
          print "plugin=${plugin} integration=${integration} bench=${bench} gl=${gl}"
          # 実行ファイルと libobs-opengl は @rpath の libobs.framework を参照する。ビルド時の framework は .deps/Frameworks、
          # libobs が参照する FFmpeg などの dylib は .deps の obs-deps にある
          deps_lib=$(dirname "$(find "$PWD/.deps" -name 'libavcodec.dylib' -print -quit)")
          print "deps_lib=${deps_lib}"
          export DYLD_FRAMEWORK_PATH="$PWD/.deps/Frameworks"
          export DYLD_LIBRARY_PATH="${deps_lib}"
          core="$PWD/.deps/obs-studio-31.1.1/libobs/data"
          failed=0
          for scenario in ${=SCENARIOS}; do
            if "${integration}" "${plugin}" "$PWD/data" "${gl}" "${core}" "${scenario}" >> render-macos.log 2>&1; then
              print "PASS ${scenario}" | tee -a render-macos.log
            else
              print "FAIL ${scenario}" | tee -a render-macos.log
              failed=1
            fi
          done
          "${bench}" "${plugin}" "$PWD/data" "${gl}" "${core}" profile ${=PROFILE_RADII} 2>&1 | tee -a render-macos.log
          exit ${failed}

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-macos
          path: render-macos.log
          if-no-files-found: warn
